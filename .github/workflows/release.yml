name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
      # 发布资产来源证明：让用户可验证 main.js/styles.css 确由本仓库构建
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
          generate_release_notes: true
